<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Organizasyon Defteri</title>
<meta name="theme-color" content="#EEEFEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Defter">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon.png">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --porselen:#EEEFEC;
  --kart:#FFFFFF;
  --murekkep:#1C2523;
  --soluk:#6B7570;
  --kadife:#21453C;
  --pirinc:#8E6E2C;
  --kirmizi:#8A2E2A;
  --cizgi:#D8DAD4;
  --golge:0 1px 2px rgba(28,37,35,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Karla,system-ui,-apple-system,sans-serif;
  background:var(--porselen);color:var(--murekkep);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.serif{font-family:"Bodoni Moda",Georgia,serif;font-weight:600;letter-spacing:-.005em}
.kabuk{max-width:520px;margin:0 auto;padding-bottom:96px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--kadife)}

/* ---- üst şerit ---- */
.tepe{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 16px) 18px 12px;
}
.marka{font-size:19px;margin:0}
.tepe-not{font-size:12px;color:var(--soluk)}

.ekran{padding:0 16px 24px}
.serit{
  margin:0 16px 12px;padding:10px 14px;border-radius:9px;
  font-size:13px;background:#F4EAD8;color:#6B4A16;
}
.serit.hata{background:#F6E2E0;color:#7A2621}

/* ---- takvim ---- */
.ay-cubugu{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.ay-adi{font-size:25px;margin:0}
.ay-yil{font-weight:400;color:var(--soluk)}
.yuvarlak{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--cizgi);
  background:var(--kart);font-size:19px;line-height:1;display:grid;place-items:center;
}
.hafta{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--soluk);text-align:center;padding-bottom:6px}
.izgara{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gun{
  position:relative;aspect-ratio:1;border:none;background:var(--kart);border-radius:8px;
  display:flex;align-items:flex-start;justify-content:flex-start;padding:5px 6px;
  font-size:13.5px;box-shadow:var(--golge);
}
.gun.disari{background:transparent;color:#B4BAB6;box-shadow:none}
.gun.bugun{box-shadow:inset 0 0 0 1.5px var(--kadife)}
.gun.acik{background:var(--murekkep);color:#fff}
.perde-kutu{
  position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:2.5px;
  border:1px solid rgba(28,37,35,.18);
}
.perde-kutu.ikinci{top:18px}
.gun-say{position:absolute;bottom:4px;left:6px;font-size:9.5px;color:var(--soluk)}
.gun.acik .gun-say{color:#C9CFCB}

.panel{margin-top:18px}
.panel-ust{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.panel-baslik{font-size:16px;margin:0}
.bos{font-size:14px;color:var(--soluk);margin:0 0 12px}

/* ---- satırlar ---- */
.satir{
  display:flex;align-items:stretch;gap:0;width:100%;background:var(--kart);
  border:none;border-radius:10px;margin-bottom:8px;text-align:left;
  overflow:hidden;box-shadow:var(--golge);
}
.satir-renk{width:5px;flex:0 0 5px}
.satir-ic{display:flex;align-items:center;gap:12px;padding:11px 13px;flex:1;min-width:0}
.satir-tarih{display:flex;flex-direction:column;align-items:center;width:34px;flex:0 0 34px}
.satir-gun{font-size:19px;line-height:1.05}
.satir-ay{font-size:9.5px;color:var(--soluk);text-transform:lowercase}
.satir-orta{flex:1;min-width:0}
.satir-ad{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir-alt{font-size:12px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir-sag{text-align:right;flex:0 0 auto}
.satir-tutar{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.satir-tutar.borc{color:var(--pirinc)}
.satir-tutar.tamam{color:var(--kadife)}
.satir-etiket{font-size:9.5px;color:var(--soluk)}

/* ---- kartlar ---- */
.kart{background:var(--kart);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:var(--golge)}
.kart-etiket{display:block;font-size:11px;color:var(--soluk);margin-bottom:3px}
.kart-deger{margin:0;font-size:15px;line-height:1.4;white-space:pre-wrap}
.kart-not{margin:4px 0 0;font-size:13px;color:var(--soluk);white-space:pre-wrap}
.bolum-baslik{font-size:12px;color:var(--soluk);font-weight:600;margin:20px 0 8px}

/* ---- form ---- */
.alan{margin-bottom:16px}
.alan:last-child{margin-bottom:0}
.et{display:block;font-size:12px;color:var(--soluk);margin-bottom:6px}
.gir{
  width:100%;border:1px solid var(--cizgi);background:var(--kart);border-radius:9px;
  padding:11px 12px;font-size:16px;
}
.gir:focus{outline:2px solid var(--kadife);outline-offset:1px}
textarea.gir{resize:vertical;line-height:1.45;font-size:15px}
.ciftli{display:flex;gap:10px}
.ciftli>div{flex:1;min-width:0}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{
  border:1px solid var(--cizgi);background:var(--kart);border-radius:999px;
  padding:7px 13px;font-size:13px;
}
.cip.secili{background:var(--murekkep);color:#fff;border-color:var(--murekkep)}

.katlanir{background:var(--kart);border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:var(--golge)}
.katlanir-bas{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:14px;border:none;background:none;font-size:15px;font-weight:600;text-align:left;
}
.katlanir-bas .ok{font-size:12px;color:var(--soluk);font-weight:400}
.katlanir-ic{padding:0 14px 16px;display:none}
.katlanir.acik .katlanir-ic{display:block}
.katlanir-ozet{font-size:12px;color:var(--pirinc);font-weight:600;font-variant-numeric:tabular-nums}

.renkler{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.renk{border:1.5px solid transparent;background:none;border-radius:8px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.renk.secili{border-color:var(--murekkep)}
.renk i{display:block;width:100%;height:26px;border-radius:5px;border:1px solid rgba(28,37,35,.14)}
.renk span{font-size:9.5px;line-height:1.1;text-align:center}

.masalar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.masa{border:1.5px solid transparent;background:var(--porselen);border-radius:9px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.masa.secili{border-color:var(--murekkep);background:var(--kart)}
.masa span{font-size:10px;text-align:center;line-height:1.2}

.onay{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:15px}
.onay input{width:20px;height:20px;accent-color:var(--kadife)}

/* ---- hesap ---- */
.hesap-satir{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--cizgi);font-size:14px;gap:12px}
.hesap-satir:last-child{border-bottom:none}
.hesap-satir.kucuk{font-size:12.5px;color:var(--soluk)}
.hesap-satir.sonuc{padding-top:12px;font-weight:700;font-size:15px;border-bottom:none}
.tutar{font-variant-numeric:tabular-nums;white-space:nowrap}
.sonuc .tutar{font-size:19px;color:var(--pirinc)}
.serif-tutar{font-family:"Bodoni Moda",Georgia,serif}

.mini-liste{margin-top:10px}
.mini{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--cizgi);font-size:13.5px}
.mini:last-child{border-bottom:none}
.mini-orta{flex:1;min-width:0}
.mini-alt{font-size:11px;color:var(--soluk)}
.sil{border:none;background:none;color:var(--kirmizi);font-size:18px;padding:2px 6px;line-height:1}
.ekle-satir{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ekle-satir .gir{flex:1;min-width:96px;padding:9px 10px;font-size:15px}

/* ---- düğmeler ---- */
.dg{border:1px solid var(--cizgi);background:var(--kart);border-radius:9px;padding:11px 15px;font-size:15px;font-weight:600}
.dg.ana{background:var(--kadife);color:#fff;border-color:var(--kadife)}
.dg.tehlike{color:var(--kirmizi)}
.dg.genis{width:100%}
.dg.ufak{padding:8px 12px;font-size:13.5px;font-weight:500}
.dg-satir{display:flex;gap:8px;margin-top:16px}
.dg-satir .dg{flex:1}
.geri{border:none;background:none;color:var(--soluk);font-size:14px;padding:12px 0}
.ipucu{font-size:12px;color:var(--soluk);margin:8px 0 0;line-height:1.45}
.hata-yazi{color:var(--kirmizi);font-size:13px;margin:0 0 10px}

.yapis{
  position:sticky;bottom:78px;background:var(--murekkep);color:#fff;
  border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;
  align-items:center;margin-top:14px;z-index:5;
}
.yapis small{display:block;font-size:10.5px;opacity:.7}
.yapis b{font-size:19px;font-variant-numeric:tabular-nums}

/* ---- sekmeler ---- */
.sekmeler{
  position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--cizgi);display:flex;
  padding:7px 6px calc(env(safe-area-inset-bottom) + 10px);z-index:20;
}
.sekme{flex:1;border:none;background:none;color:var(--soluk);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
.sekme.aktif{color:var(--kadife);font-weight:600}

/* ---- rapor ---- */
.ozet-kutular{display:flex;gap:8px;margin-bottom:16px}
.ozet-kutu{flex:1;background:var(--kart);border-radius:10px;padding:12px;box-shadow:var(--golge)}
.ozet-kutu b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.ozet-kutu small{font-size:10.5px;color:var(--soluk)}
.gelir-renk{color:var(--kadife)}
.gider-renk{color:var(--kirmizi)}

/* ---- yazdırma ---- */
#yazdirma{display:none}
@media print{
  body{background:#fff}
  .kabuk,.sekmeler{display:none !important}
  #yazdirma{display:block;padding:0;font-size:12px}
  #yazdirma h1{font-size:20px;margin:0 0 2px}
  #yazdirma h2{font-size:14px;margin:18px 0 6px}
  #yazdirma table{width:100%;border-collapse:collapse}
  #yazdirma th,#yazdirma td{border-bottom:1px solid #ccc;padding:5px 4px;text-align:left}
  #yazdirma td.sag,#yazdirma th.sag{text-align:right}
  #yazdirma tr.kalin td{font-weight:700;border-top:2px solid #333;border-bottom:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="kabuk">
  <header class="tepe">
    <h1 class="marka serif">Organizasyon Defteri</h1>
    <span class="tepe-not" id="tepeNot"></span>
  </header>
  <div id="serit"></div>
  <main id="uygulama"><div class="ekran"><p class="bos">Yükleniyor…</p></div></main>
</div>

<nav class="sekmeler" id="sekmeler"></nav>
<div id="yazdirma"></div>

<script>
"use strict";

/* ================= sabitler ================= */
const ANAHTAR = "org-defteri:v2";

const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AY_KISA = ["oca","şub","mar","nis","may","haz","tem","ağu","eyl","eki","kas","ara"];
const GUN_ADLARI = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];

const RENKLER = [
  {ad:"Bordo",hex:"#6E1023"},{ad:"Kırmızı",hex:"#A32020"},{ad:"Somon",hex:"#E8927C"},
  {ad:"Pudra",hex:"#E8C4C4"},{ad:"Beyaz",hex:"#F7F5F2"},{ad:"Krem",hex:"#E8DCC6"},
  {ad:"Şampanya",hex:"#E5D3B3"},{ad:"Altın",hex:"#C39B47"},{ad:"Gümüş",hex:"#C0C3C7"},
  {ad:"Füme",hex:"#6B6B72"},{ad:"Siyah",hex:"#16151A"},{ad:"Lacivert",hex:"#1F2C4C"},
  {ad:"Mavi",hex:"#3A6EA5"},{ad:"Turkuaz",hex:"#2E7E8C"},{ad:"Yeşil",hex:"#2F5D46"},
  {ad:"Mor",hex:"#4A2A5A"},{ad:"Lila",hex:"#B7A2CC"},{ad:"Bej",hex:"#D9C9AE"},
  {ad:"Kahve",hex:"#5A4030"},{ad:"Zeytin",hex:"#6C7248"}
];

const TURLER = ["Düğün","Nişan","Kına","Söz","Sünnet","Doğum günü","Kurumsal","Diğer"];

const MASALAR = [
  {id:"yuvarlak",ad:"Yuvarlak"},
  {id:"gelin",ad:"Gelin masası + yuvarlak"},
  {id:"imperial",ad:"Uzun masa"},
  {id:"u",ad:"U düzeni"},
  {id:"kokteyl",ad:"Kokteyl"},
  {id:"karma",ad:"Karma"}
];

const ORG_GIDER_KALEMLERI = ["Personel gideri","Maaş","Market gideri","Ozalit gideri","Faturalar","Ulaşım","Diğer"];
const SABIT_GIDER_KALEMLERI = ["Kira","Aidat","Stopaj"];

/* ================= durum ================= */
let D = null;
let ekran = "takvim";
let acikAy = new Date().getMonth();
let acikYil = new Date().getFullYear();
let acikGun = null;
let seciliOrg = null;
let taslak = null;
let raporAy = ayAnahtar(bugunISO());
let giderAy = ayAnahtar(bugunISO());

function varsayilan(){
  return {
    organizasyonlar: [],
    menuFiyatlari: [{id:yeniId(), gecerli:"2026-01-01", ordovr:0, et:0, tavuk:0}],
    sabitGiderler: {},
    digerGiderler: [],
    ayarlar: {garsonBasi:10, faturaOrani:20}
  };
}

/* ================= yardımcılar ================= */
function yeniId(){ return "k"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sayi(v){ const n=parseFloat(String(v).replace(",", ".")); return isFinite(n)?n:0; }
function para(n){ return new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(Math.round(sayi(n))); }
function paraDuz(n){ return new Intl.NumberFormat("tr-TR",{maximumFractionDigits:2}).format(sayi(n)); }
function iki(n){ return String(n).padStart(2,"0"); }
function bugunISO(){ const d=new Date(); return d.getFullYear()+"-"+iki(d.getMonth()+1)+"-"+iki(d.getDate()); }
function ayAnahtar(iso){ return iso? iso.slice(0,7) : ""; }
function ayAdi(anahtar){ if(!anahtar) return "—"; const [y,m]=anahtar.split("-"); return AYLAR[Number(m)-1]+" "+y; }
function tarihYaz(iso){ if(!iso) return "—"; const [y,m,g]=iso.split("-"); return Number(g)+" "+AYLAR[Number(m)-1]+" "+y; }
function tarihKisa(iso){ if(!iso) return "—"; const [y,m,g]=iso.split("-"); return Number(g)+" "+AY_KISA[Number(m)-1]; }
function renkHex(ad){ const r=RENKLER.find(x=>x.ad===ad); return r?r.hex:"#D8DAD4"; }
function el(id){ return document.getElementById(id); }

function serit(mesaj, tip){
  const k = el("serit");
  if(!mesaj){ k.innerHTML=""; return; }
  k.innerHTML = '<div class="serit '+(tip==="hata"?"hata":"")+'">'+esc(mesaj)+'</div>';
  if(tip!=="hata") setTimeout(()=>{ if(el("serit")) el("serit").innerHTML=""; }, 4000);
}

/* ================= depolama ================= */
const Depo = {
  mod:"bellek", bellek:null,
  async yukle(){
    if(typeof window!=="undefined" && window.storage && window.storage.get){
      this.mod="ortak";
      try{
        const s = await window.storage.get(ANAHTAR, true);
        if(s && s.value) return JSON.parse(s.value);
      }catch(e){}
      return null;
    }
    try{
      const s = localStorage.getItem(ANAHTAR);
      this.mod="cihaz";
      return s? JSON.parse(s) : null;
    }catch(e){ this.mod="bellek"; return this.bellek; }
  },
  async kaydet(veri){
    const metin = JSON.stringify(veri);
    if(this.mod==="ortak"){
      try{ await window.storage.set(ANAHTAR, metin, true); return true; }
      catch(e){ return false; }
    }
    if(this.mod==="cihaz"){
      try{ localStorage.setItem(ANAHTAR, metin); return true; }
      catch(e){ this.mod="bellek"; }
    }
    this.bellek = veri;
    return true;
  }
};

async function kaydet(){
  const ok = await Depo.kaydet(D);
  if(!ok) serit("Kayıt yazılamadı. Bağlantınızı kontrol edin.","hata");
}

/* ================= hesap ================= */
function menuFiyatiBul(tarih){
  const liste = (D.menuFiyatlari||[]).slice().sort((a,b)=>a.gecerli.localeCompare(b.gecerli));
  if(!liste.length) return {ordovr:0,et:0,tavuk:0};
  let secili = liste[0];
  for(const f of liste){ if(!tarih || f.gecerli<=tarih) secili=f; }
  return secili;
}

function hesapla(o){
  const f = menuFiyatiBul(o.tarih);
  const m = o.menuler||{};
  let kisiBasi = 0;
  if(m.ordovr) kisiBasi += sayi(f.ordovr);
  if(m.et) kisiBasi += sayi(f.et);
  if(m.tavuk) kisiBasi += sayi(f.tavuk);
  if(o.kisiBasiOzel !== "" && o.kisiBasiOzel != null) kisiBasi = sayi(o.kisiBasiOzel);

  const kisi = sayi(o.kisiSayisi);
  const yemek = kisiBasi * kisi;

  const dk = o.dekorasyon||{};
  const dekorasyon = sayi(dk.tavan&&dk.tavan.ucret) + sayi(dk.perde&&dk.perde.ucret) + sayi(dk.zemin&&dk.zemin.ucret);

  const ts = o.tasarim||{};
  const tasarim = (ts.menuKarti&&ts.menuKarti.secili? sayi(ts.menuKarti.ucret):0)
                + (ts.ayna&&ts.ayna.secili? sayi(ts.ayna.ucret):0);

  const ara = yemek + dekorasyon + tasarim;
  const oran = sayi(D.ayarlar.faturaOrani)/100;
  const fatura = o.faturali ? ara*oran : 0;
  const toplam = ara + fatura;

  const alinan = (o.odemeler||[]).reduce((t,x)=>t+sayi(x.tutar),0);
  const gider = (o.giderler||[]).reduce((t,x)=>t+sayi(x.tutar),0);
  const garsonBasi = sayi(D.ayarlar.garsonBasi)||10;
  const garson = kisi>0 ? Math.ceil(kisi/garsonBasi) : 0;

  return {kisiBasi,yemek,dekorasyon,tasarim,ara,fatura,toplam,alinan,kalan:toplam-alinan,gider,garson};
}

function aylikRapor(anahtar){
  const gelirler=[], giderler=[];
  for(const o of D.organizasyonlar){
    for(const p of (o.odemeler||[])){
      if(ayAnahtar(p.tarih)===anahtar)
        gelirler.push({tarih:p.tarih, ad:(o.musteri||"İsimsiz"), kalem:p.etiket||"Ödeme", tutar:sayi(p.tutar)});
    }
    for(const g of (o.giderler||[])){
      const t = g.tarih || o.tarih;
      if(ayAnahtar(t)===anahtar)
        giderler.push({tarih:t, ad:(o.musteri||"İsimsiz"), kalem:g.kalem||"Gider", tutar:sayi(g.tutar), tur:"organizasyon"});
    }
  }
  for(const s of (D.sabitGiderler[anahtar]||[]))
    giderler.push({tarih:anahtar+"-01", ad:"Aylık sabit", kalem:s.kalem, tutar:sayi(s.tutar), tur:"sabit"});
  for(const g of (D.digerGiderler||[]))
    if(ayAnahtar(g.tarih)===anahtar)
      giderler.push({tarih:g.tarih, ad:g.aciklama||"Genel", kalem:g.kalem, tutar:sayi(g.tutar), tur:"diger"});

  gelirler.sort((a,b)=>a.tarih.localeCompare(b.tarih));
  giderler.sort((a,b)=>a.tarih.localeCompare(b.tarih));
  const tg = gelirler.reduce((t,x)=>t+x.tutar,0);
  const tgi = giderler.reduce((t,x)=>t+x.tutar,0);
  return {gelirler,giderler,toplamGelir:tg,toplamGider:tgi,net:tg-tgi};
}

function ayKaydir(anahtar,adim){
  let [y,m]=anahtar.split("-").map(Number);
  m+=adim;
  if(m<1){m=12;y--;} if(m>12){m=1;y++;}
  return y+"-"+iki(m);
}

  else ic='<rect x="14" y="14" width="14" height="42" rx="2" '+d+'/><rect x="14" y="14" width="14" height="42" rx="2" '+s+'/>'+[[46,22],[46,48],[64,35]].map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="8" '+d+'/><circle cx="'+p[0]+'" cy="'+p[1]+'" r="8" '+s+'/>').join("");

/* ================= render: takvim ================= */
function takvimEkrani(){
  const ilk = new Date(acikYil,acikAy,1);
  const kayma = (ilk.getDay()+6)%7;
  const gunSayisi = new Date(acikYil,acikAy+1,0).getDate();
  const oncekiSon = new Date(acikYil,acikAy,0).getDate();
  const bug = bugunISO();

  let hucreler="";
  for(let i=kayma-1;i>=0;i--) hucreler+='<div class="gun disari">'+(oncekiSon-i)+'</div>';
  for(let g=1;g<=gunSayisi;g++){
    const iso = acikYil+"-"+iki(acikAy+1)+"-"+iki(g);
    const orgs = D.organizasyonlar.filter(o=>o.tarih===iso);
    let kutular="";
    orgs.slice(0,2).forEach((o,i)=>{
      const renk = renkHex(o.dekorasyon && o.dekorasyon.perde ? o.dekorasyon.perde.renk : "");
      kutular += '<span class="perde-kutu'+(i===1?" ikinci":"")+'" style="background:'+renk+'"></span>';
    });
    hucreler += '<button class="gun'+(iso===bug?" bugun":"")+(iso===acikGun?" acik":"")+'" data-gun="'+iso+'">'
      + g + kutular + (orgs.length>2? '<span class="gun-say">+'+(orgs.length-2)+'</span>':'') + '</button>';
  }

  let panel="";
  if(acikGun){
    const orgs = D.organizasyonlar.filter(o=>o.tarih===acikGun);
    panel = '<div class="panel"><div class="panel-ust"><h2 class="panel-baslik serif">'+tarihYaz(acikGun)+'</h2>'
      + '<button class="dg ufak ana" data-yeni="'+acikGun+'">+ Organizasyon</button></div>'
      + (orgs.length? orgs.map(orgSatiri).join("") : '<p class="bos">Bu güne kayıt yok.</p>')
      + '</div>';
  }

  const ayOrgs = D.organizasyonlar
    .filter(o=>ayAnahtar(o.tarih)===acikYil+"-"+iki(acikAy+1))
    .sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||""));

  return '<div class="ekran">'
    + '<div class="ay-cubugu"><button class="yuvarlak" data-ay="-1" aria-label="Önceki ay">‹</button>'
    + '<h2 class="ay-adi serif">'+AYLAR[acikAy]+' <span class="ay-yil">'+acikYil+'</span></h2>'
    + '<button class="yuvarlak" data-ay="1" aria-label="Sonraki ay">›</button></div>'
    + '<div class="hafta">'+GUN_ADLARI.map(g=>'<span>'+g+'</span>').join("")+'</div>'
    + '<div class="izgara">'+hucreler+'</div>'
    + panel
    + '<h3 class="bolum-baslik">Bu ayın organizasyonları ('+ayOrgs.length+')</h3>'
    + (ayOrgs.length? ayOrgs.map(orgSatiri).join("") : '<p class="bos">Bu ay kayıt yok. Takvimde bir güne dokunup ekleyin.</p>')
    + '</div>';
}

  return '<button class="satir" data-org="'+o.id+'">'
    + '<span class="satir-renk" style="background:'+renk+'"></span>'

function formOzetGuncelle(){
  if(!taslak) return;
  const h = hesapla(taslak);
  const y = el("yapisToplam"); if(y) y.textContent = para(h.toplam);
  const g = el("garsonYazi"); if(g) g.textContent = h.garson? h.garson+" garson" : "Kişi sayısı girin";
  const set=(id,v)=>{const e=el(id); if(e) e.textContent=v;};
  set("ozetGenel", taslak.kisiSayisi? taslak.kisiSayisi+" kişi" : "");
  set("ozetMenu", para(h.yemek)+(taslak.faturali?" +fatura":""));
  set("ozetDekor", para(h.dekorasyon));
  set("ozetTasarim", para(h.tasarim));
  set("ozetOdeme", para(h.alinan));
  set("ozetGider", para(h.gider));
  odemeListeCiz(); giderListeCiz();
}

function odemeListeCiz(){
  const k = el("odemeListe"); if(!k) return;
  k.innerHTML = (taslak.odemeler||[]).length
    ? '<div class="mini-liste">'+taslak.odemeler.map(p=>
        '<div class="mini"><div class="mini-orta"><div>'+esc(p.etiket)+'</div><div class="mini-alt">'+tarihYaz(p.tarih)+'</div></div>'
        + '<span class="tutar" style="font-weight:600">'+para(p.tutar)+'</span>'
        + '<button type="button" class="sil" data-odeme-sil="'+p.id+'">×</button></div>').join("")+'</div>'
    : '<p class="bos" style="margin:0">Ödeme girilmemiş.</p>';
}
function giderListeCiz(){
  const k = el("giderListe"); if(!k) return;
  k.innerHTML = (taslak.giderler||[]).length
    ? '<div class="mini-liste">'+taslak.giderler.map(g=>
        '<div class="mini"><div class="mini-orta"><div>'+esc(g.kalem)+'</div><div class="mini-alt">'+tarihYaz(g.tarih||taslak.tarih)+'</div></div>'
        + '<span class="tutar" style="font-weight:600">'+para(g.tutar)+'</span>'
        + '<button type="button" class="sil" data-gider-sil="'+g.id+'">×</button></div>').join("")+'</div>'
    : '<p class="bos" style="margin:0">Gider girilmemiş.</p>';
}

/* ================= çizim ================= */
function ciz(){
  let icerik="";
  if(ekran==="takvim") icerik=takvimEkrani();
  else if(ekran==="detay") icerik=detayEkrani();
  else if(ekran==="form") icerik=formEkrani();
  else if(ekran==="gider") icerik=giderEkrani();
  else if(ekran==="rapor") icerik=raporEkrani();
  else if(ekran==="fiyat") icerik=fiyatEkrani();
  el("uygulama").innerHTML = icerik;
  el("tepeNot").textContent = D.organizasyonlar.length+" kayıt";
  sekmeleriCiz();
  if(ekran==="form") formOzetGuncelle();
  window.scrollTo(0,0);
}

/* ================= olaylar ================= */
document.addEventListener("click", async (e)=>{
  const h = (s)=>e.target.closest(s);
  let n;

  if((n=h("[data-sekme]"))){ ekran=n.dataset.sekme; acikGun=null; ciz(); return; }
  if((n=h("[data-ay]"))){
    acikAy += Number(n.dataset.ay); acikGun=null;
    if(acikAy<0){acikAy=11;acikYil--;} if(acikAy>11){acikAy=0;acikYil++;}
    ciz(); return;
  }
  if((n=h("[data-gun]"))){ acikGun = (acikGun===n.dataset.gun)? null : n.dataset.gun; ciz(); return; }
  if((n=h("[data-yeni]"))){ taslak=yeniOrg(n.dataset.yeni); ekran="form"; ciz(); return; }
  if((n=h("[data-org]"))){ seciliOrg=n.dataset.org; ekran="detay"; ciz(); return; }
  if(h("[data-geri]")){ ekran = (ekran==="form" && seciliOrg && D.organizasyonlar.some(x=>x.id===seciliOrg))?"detay":"takvim"; ciz(); return; }
  if((n=h("[data-duzenle]"))){
    taslak = JSON.parse(JSON.stringify(D.organizasyonlar.find(x=>x.id===n.dataset.duzenle)));
    ekran="form"; ciz(); return;
  }
  if((n=h("[data-sil]"))){
    if(!confirm("Bu organizasyon silinsin mi? Geri alınamaz.")) return;
    D.organizasyonlar = D.organizasyonlar.filter(x=>x.id!==n.dataset.sil);
    seciliOrg=null; ekran="takvim"; await kaydet(); ciz(); return;
  }

  /* form içi */
  if((n=h("[data-kat]"))){ el("kat_"+n.dataset.kat).classList.toggle("acik"); return; }
  if((n=h("[data-cip]"))){
    taslak.tur = n.dataset.cip;
    n.parentElement.querySelectorAll(".cip").forEach(c=>c.classList.remove("secili"));
    n.classList.add("secili"); return;
  }
  if((n=h("[data-renk]"))){
    const grup = n.closest("[data-renk-grup]");
    const yol = grup.dataset.renkGrup.split(".");
    taslak[yol[0]][yol[1]][yol[2]] = n.dataset.renk;
    grup.querySelectorAll(".renk").forEach(c=>c.classList.remove("secili"));
    n.classList.add("secili"); return;
  }
  if((n=h("[data-masa]"))){
    taslak.dekorasyon.masa.duzen = n.dataset.masa;
    n.parentElement.querySelectorAll(".masa").forEach(c=>c.classList.remove("secili"));
    n.classList.add("secili"); return;
  }
  if(h("#odemeEkle")){
    const tutar = sayi(el("odemeTutar").value);
    if(!tutar) return;
    taslak.odemeler.push({id:yeniId(), etiket:el("odemeEtiket").value, tutar, tarih:el("odemeTarih").value||bugunISO()});
    el("odemeTutar").value=""; formOzetGuncelle(); return;
  }
  if((n=h("[data-odeme-sil]"))){ taslak.odemeler=taslak.odemeler.filter(p=>p.id!==n.dataset.odemeSil); formOzetGuncelle(); return; }
  if(h("#giderEkle")){
    const tutar = sayi(el("giderTutar").value);
    if(!tutar) return;
    taslak.giderler.push({id:yeniId(), kalem:el("giderKalem").value, tutar, tarih:el("giderTarih").value||taslak.tarih});
    el("giderTutar").value=""; formOzetGuncelle(); return;
  }
  if((n=h("[data-gider-sil]"))){ taslak.giderler=taslak.giderler.filter(g=>g.id!==n.dataset.giderSil); formOzetGuncelle(); return; }
  if(h("#kaydetDugme")){
    if(!taslak.musteri.trim()){ formHata("Müşteri adı gerekli."); return; }
    if(!taslak.tarih){ formHata("Organizasyon tarihi gerekli."); return; }
    const i = D.organizasyonlar.findIndex(x=>x.id===taslak.id);
    if(i>=0) D.organizasyonlar[i]=taslak; else D.organizasyonlar.push(taslak);
    seciliOrg = taslak.id;
    await kaydet();
    ekran="detay"; ciz(); serit("Kaydedildi."); return;
  }

  /* gider ekranı */
  if((n=h("[data-giderAy]"))){ giderAy = ayKaydir(giderAy, Number(n.dataset.giderAy)); ciz(); return; }
  if(h("#sabitEkle")){
    const kalem = el("sabitKalem").value.trim(), tutar = sayi(el("sabitTutar").value);
    if(!kalem || !tutar) return;
    if(!D.sabitGiderler[giderAy]) D.sabitGiderler[giderAy]=[];
    D.sabitGiderler[giderAy].push({id:yeniId(), kalem, tutar});
    await kaydet(); ciz(); return;
  }
  if((n=h("[data-sabit-sil]"))){
    D.sabitGiderler[giderAy] = (D.sabitGiderler[giderAy]||[]).filter(s=>s.id!==n.dataset.sabitSil);
    await kaydet(); ciz(); return;
  }
  if(h("#oncekiAydanKopyala")){
    const onceki = ayKaydir(giderAy,-1);
    const kaynak = D.sabitGiderler[onceki]||[];
    if(!kaynak.length){ serit("Önceki ayda sabit gider yok.","hata"); return; }
    D.sabitGiderler[giderAy] = kaynak.map(s=>({id:yeniId(), kalem:s.kalem, tutar:s.tutar}));
    await kaydet(); ciz(); serit(kaynak.length+" kalem kopyalandı."); return;
  }
  if(h("#digerEkle")){
    const kalem = el("digerKalem").value.trim(), tutar = sayi(el("digerTutar").value);
    if(!kalem || !tutar) return;
    D.digerGiderler.push({id:yeniId(), kalem, tutar, tarih:el("digerTarih").value||giderAy+"-01", aciklama:""});
    await kaydet(); ciz(); return;
  }
  if((n=h("[data-diger-sil]"))){
    D.digerGiderler = D.digerGiderler.filter(g=>g.id!==n.dataset.digerSil);
    await kaydet(); ciz(); return;
  }

  /* rapor */
  if((n=h("[data-raporAy]"))){ raporAy = ayKaydir(raporAy, Number(n.dataset.raporAy)); ciz(); return; }
  if(h("#pdfDugme")){ pdfYazdir(); return; }
  if(h("#excelDugme")){ excelIndir(); return; }

  /* fiyat */
  if(h("#fiyatEkle")){
    D.menuFiyatlari.push({id:yeniId(), gecerli:el("fTarih").value||bugunISO(),
      ordovr:sayi(el("fOrdovr").value), et:sayi(el("fEt").value), tavuk:sayi(el("fTavuk").value)});
    await kaydet(); ciz(); serit("Fiyat listesi eklendi."); return;
  }
  if((n=h("[data-fiyat-sil]"))){
    if(D.menuFiyatlari.length<=1){ serit("En az bir fiyat listesi kalmalı.","hata"); return; }
    D.menuFiyatlari = D.menuFiyatlari.filter(f=>f.id!==n.dataset.fiyatSil);
    await kaydet(); ciz(); return;
  }
  if(h("#ayarKaydet")){
    D.ayarlar.garsonBasi = sayi(el("aGarson").value)||10;
    D.ayarlar.faturaOrani = sayi(el("aFatura").value);
    await kaydet(); ciz(); serit("Ayarlar kaydedildi."); return;
  }
  if(h("#yedekAl")){ yedekIndir(); return; }
});

function formHata(m){
  const k = el("formHata");
  if(k){ k.textContent=m; k.style.display="block"; window.scrollTo(0,0); }
}

document.addEventListener("input",(e)=>{
  if(ekran!=="form"||!taslak) return;
  const t = e.target;
  if(t.dataset.alan){ taslak[t.dataset.alan]=t.value; }
  else if(t.dataset.dekor){
    const [a,b]=t.dataset.dekor.split(".");
    taslak.dekorasyon[a][b]=t.value;
  }
  else if(t.dataset.tasarimAlan){
    const [a,b]=t.dataset.tasarimAlan.split(".");
    taslak.tasarim[a][b]=t.value;
  }
  if(t.dataset.hesap || t.dataset.alan==="kisiSayisi") formOzetGuncelle();
});

document.addEventListener("change",(e)=>{
  if(ekran!=="form"||!taslak) return;
  const t = e.target;
  if(t.dataset.menu){ taslak.menuler[t.dataset.menu]=t.checked; formOzetGuncelle(); }
  else if(t.dataset.fatura){ taslak.faturali=t.checked; formOzetGuncelle(); }
  else if(t.dataset.tasarim){ taslak.tasarim[t.dataset.tasarim].secili=t.checked; formOzetGuncelle(); }
  else if(t.dataset.alan==="tarih"){ ciz(); }
});

/* ================= dışa aktarma ================= */
function raporSatirlari(){
  const r = aylikRapor(raporAy);
  return r;
}

function pdfYazdir(){
  const r = raporSatirlari();
  const satir = (a)=>'<tr><td>'+esc(tarihYaz(a.tarih))+'</td><td>'+esc(a.ad)+'</td><td>'+esc(a.kalem)+'</td><td class="sag">'+paraDuz(a.tutar)+' TL</td></tr>';
  el("yazdirma").innerHTML =
      '<h1>Gelir–Gider Tablosu</h1><p>'+ayAdi(raporAy)+' · Organizasyon Defteri</p>'
    + '<h2>Gelirler</h2><table><tr><th>Tarih</th><th>Kayıt</th><th>Kalem</th><th class="sag">Tutar</th></tr>'
    + (r.gelirler.map(satir).join("")||'<tr><td colspan="4">Kayıt yok</td></tr>')
    + '<tr class="kalin"><td colspan="3">Toplam gelir</td><td class="sag">'+paraDuz(r.toplamGelir)+' TL</td></tr></table>'
    + '<h2>Giderler</h2><table><tr><th>Tarih</th><th>Kayıt</th><th>Kalem</th><th class="sag">Tutar</th></tr>'
    + (r.giderler.map(satir).join("")||'<tr><td colspan="4">Kayıt yok</td></tr>')
    + '<tr class="kalin"><td colspan="3">Toplam gider</td><td class="sag">'+paraDuz(r.toplamGider)+' TL</td></tr></table>'
    + '<h2>Sonuç</h2><table><tr class="kalin"><td>Net ('+ayAdi(raporAy)+')</td><td class="sag">'+paraDuz(r.net)+' TL</td></tr></table>';
  setTimeout(()=>window.print(),120);
}

function dosyaIndir(icerik,ad,tip){
  try{
    const blob = new Blob([icerik],{type:tip});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download=ad; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),3000);
    return true;
  }catch(err){ serit("Dosya indirilemedi.","hata"); return false; }
}

function excelIndir(){
  const r = raporSatirlari();
  const q = (s)=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const satirlar = [["Tür","Tarih","Kayıt","Kalem","Tutar (TL)"]];
  r.gelirler.forEach(g=>satirlar.push(["Gelir",g.tarih,g.ad,g.kalem,g.tutar]));
  r.giderler.forEach(g=>satirlar.push(["Gider",g.tarih,g.ad,g.kalem,g.tutar]));
  satirlar.push([]);
  satirlar.push(["","","","Toplam gelir",r.toplamGelir]);
  satirlar.push(["","","","Toplam gider",r.toplamGider]);
  satirlar.push(["","","","Net",r.net]);
  const csv = "\uFEFF"+satirlar.map(s=>s.map(q).join(";")).join("\r\n");
  dosyaIndir(csv,"gelir-gider-"+raporAy+".csv","text/csv;charset=utf-8");
}

function yedekIndir(){
  dosyaIndir(JSON.stringify(D,null,2),"organizasyon-defteri-yedek-"+bugunISO()+".json","application/json");
}

  D = veri && typeof veri==="object" ? Object.assign(varsayilan(), veri) : varsayilan();
  if(!D.ayarlar) D.ayarlar={garsonBasi:10,faturaOrani:20};
  if(!D.sabitGiderler) D.sabitGiderler={};
  if(!D.digerGiderler) D.digerGiderler=[];
  ciz();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
