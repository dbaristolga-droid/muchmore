<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Much&More Organizasyon Yönetimi</title>
<meta name="theme-color" content="#EEEFEC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Much&More">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon.png">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --porselen:#EEEFEC;
  --kart:#FFFFFF;
  --murekkep:#1C2523;
  --soluk:#6B7570;
  --kadife:#21453C;
  --pirinc:#8E6E2C;
  --kirmizi:#8A2E2A;
  --cizgi:#D8DAD4;
  --golge:0 1px 2px rgba(28,37,35,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:Karla,system-ui,-apple-system,sans-serif;
  background:var(--porselen);color:var(--murekkep);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.serif{font-family:"Bodoni Moda",Georgia,serif;font-weight:600;letter-spacing:-.005em}
.kabuk{max-width:520px;margin:0 auto;padding-bottom:96px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--kadife)}

/* ---- üst şerit ---- */
.tepe{
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 16px) 18px 12px;
}
.marka{font-size:19px;margin:0}
.tepe-not{font-size:12px;color:var(--soluk)}

.ekran{padding:0 16px 24px}
.serit{
  margin:0 16px 12px;padding:10px 14px;border-radius:9px;
  font-size:13px;background:#F4EAD8;color:#6B4A16;
}
.serit.hata{background:#F6E2E0;color:#7A2621}

/* ---- takvim ---- */
.ay-cubugu{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.ay-adi{font-size:25px;margin:0}
.ay-yil{font-weight:400;color:var(--soluk)}
.yuvarlak{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--cizgi);
  background:var(--kart);font-size:19px;line-height:1;display:grid;place-items:center;
}
.hafta{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10.5px;color:var(--soluk);text-align:center;padding-bottom:6px}
.izgara{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.gun{
  position:relative;aspect-ratio:1;border:none;background:var(--kart);border-radius:8px;
  display:flex;align-items:flex-start;justify-content:flex-start;padding:5px 6px;
  font-size:13.5px;box-shadow:var(--golge);
}
.gun.disari{background:transparent;color:#B4BAB6;box-shadow:none}
.gun.bugun{box-shadow:inset 0 0 0 1.5px var(--kadife)}
.gun.acik{background:var(--murekkep);color:#fff}
.perde-kutu{
  position:absolute;top:4px;right:4px;width:11px;height:11px;border-radius:2.5px;
  border:1px solid rgba(28,37,35,.18);
}
.perde-kutu.ikinci{top:18px}
.gun-say{position:absolute;bottom:4px;left:6px;font-size:9.5px;color:var(--soluk)}
.gun.acik .gun-say{color:#C9CFCB}

.panel{margin-top:18px}
.panel-ust{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.panel-baslik{font-size:16px;margin:0}
.bos{font-size:14px;color:var(--soluk);margin:0 0 12px}

/* ---- satırlar ---- */
.satir{
  display:flex;align-items:stretch;gap:0;width:100%;background:var(--kart);
  border:none;border-radius:10px;margin-bottom:8px;text-align:left;
  overflow:hidden;box-shadow:var(--golge);
}
.satir-renk{width:5px;flex:0 0 5px}
.satir-ic{display:flex;align-items:center;gap:12px;padding:11px 13px;flex:1;min-width:0}
.satir-tarih{display:flex;flex-direction:column;align-items:center;width:34px;flex:0 0 34px}
.satir-gun{font-size:19px;line-height:1.05}
.satir-ay{font-size:9.5px;color:var(--soluk);text-transform:lowercase}
.satir-orta{flex:1;min-width:0}
.satir-ad{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir-alt{font-size:12px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.satir-sag{text-align:right;flex:0 0 auto}
.satir-tutar{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.satir-tutar.borc{color:var(--pirinc)}
.satir-tutar.tamam{color:var(--kadife)}
.satir-etiket{font-size:9.5px;color:var(--soluk)}

/* ---- kartlar ---- */
.kart{background:var(--kart);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:var(--golge)}
.kart-etiket{display:block;font-size:11px;color:var(--soluk);margin-bottom:3px}
.kart-deger{margin:0;font-size:15px;line-height:1.4;white-space:pre-wrap}
.kart-not{margin:4px 0 0;font-size:13px;color:var(--soluk);white-space:pre-wrap}
.bolum-baslik{font-size:12px;color:var(--soluk);font-weight:600;margin:20px 0 8px}

/* ---- form ---- */
.alan{margin-bottom:16px}
.alan:last-child{margin-bottom:0}
.et{display:block;font-size:12px;color:var(--soluk);margin-bottom:6px}
.gir{
  width:100%;border:1px solid var(--cizgi);background:var(--kart);border-radius:9px;
  padding:11px 12px;font-size:16px;
}
.gir:focus{outline:2px solid var(--kadife);outline-offset:1px}
textarea.gir{resize:vertical;line-height:1.45;font-size:15px}
.ciftli{display:flex;gap:10px}
.ciftli>div{flex:1;min-width:0}
.cipler{display:flex;flex-wrap:wrap;gap:6px}
.cip{
  border:1px solid var(--cizgi);background:var(--kart);border-radius:999px;
  padding:7px 13px;font-size:13px;
}
.cip.secili{background:var(--murekkep);color:#fff;border-color:var(--murekkep)}

.katlanir{background:var(--kart);border-radius:10px;margin-bottom:10px;overflow:hidden;box-shadow:var(--golge)}
.katlanir-bas{
  width:100%;display:flex;align-items:center;justify-content:space-between;
  padding:14px;border:none;background:none;font-size:15px;font-weight:600;text-align:left;
}
.katlanir-bas .ok{font-size:12px;color:var(--soluk);font-weight:400}
.katlanir-ic{padding:0 14px 16px;display:none}
.katlanir.acik .katlanir-ic{display:block}
.katlanir-ozet{font-size:12px;color:var(--pirinc);font-weight:600;font-variant-numeric:tabular-nums}

.renkler{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.renk{border:1.5px solid transparent;background:none;border-radius:8px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:4px}
.renk.secili{border-color:var(--murekkep)}
.renk i{display:block;width:100%;height:26px;border-radius:5px;border:1px solid rgba(28,37,35,.14)}
.renk span{font-size:9.5px;line-height:1.1;text-align:center}

.masalar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.masa{border:1.5px solid transparent;background:var(--porselen);border-radius:9px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px}
.masa.secili{border-color:var(--murekkep);background:var(--kart)}
.masa span{font-size:10px;text-align:center;line-height:1.2}

.onay{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:15px}
.onay input{width:20px;height:20px;accent-color:var(--kadife)}

/* ---- hesap ---- */
.hesap-satir{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--cizgi);font-size:14px;gap:12px}
.hesap-satir:last-child{border-bottom:none}
.hesap-satir.kucuk{font-size:12.5px;color:var(--soluk)}
.hesap-satir.sonuc{padding-top:12px;font-weight:700;font-size:15px;border-bottom:none}
.tutar{font-variant-numeric:tabular-nums;white-space:nowrap}
.sonuc .tutar{font-size:19px;color:var(--pirinc)}
.serif-tutar{font-family:"Bodoni Moda",Georgia,serif}

.mini-liste{margin-top:10px}
.mini{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--cizgi);font-size:13.5px}
.mini:last-child{border-bottom:none}
.mini-orta{flex:1;min-width:0}
.mini-alt{font-size:11px;color:var(--soluk)}
.sil{border:none;background:none;color:var(--kirmizi);font-size:18px;padding:2px 6px;line-height:1}
.ekle-satir{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.ekle-satir .gir{flex:1;min-width:96px;padding:9px 10px;font-size:15px}

/* ---- düğmeler ---- */
.dg{border:1px solid var(--cizgi);background:var(--kart);border-radius:9px;padding:11px 15px;font-size:15px;font-weight:600}
.dg.ana{background:var(--kadife);color:#fff;border-color:var(--kadife)}
.dg.tehlike{color:var(--kirmizi)}
.dg.genis{width:100%}
.dg.ufak{padding:8px 12px;font-size:13.5px;font-weight:500}
.dg-satir{display:flex;gap:8px;margin-top:16px}
.dg-satir .dg{flex:1}
.geri{border:none;background:none;color:var(--soluk);font-size:14px;padding:12px 0}
.ipucu{font-size:12px;color:var(--soluk);margin:8px 0 0;line-height:1.45}
.hata-yazi{color:var(--kirmizi);font-size:13px;margin:0 0 10px}

.yapis{
  position:sticky;bottom:78px;background:var(--murekkep);color:#fff;
  border-radius:10px;padding:11px 14px;display:flex;justify-content:space-between;
  align-items:center;margin-top:14px;z-index:5;
}
.yapis small{display:block;font-size:10.5px;opacity:.7}
.yapis b{font-size:19px;font-variant-numeric:tabular-nums}

/* ---- sekmeler ---- */
.sekmeler{
  position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;
  background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--cizgi);display:flex;
  padding:7px 6px calc(env(safe-area-inset-bottom) + 10px);z-index:20;
}
.sekme{flex:1;border:none;background:none;color:var(--soluk);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}
.sekme.aktif{color:var(--kadife);font-weight:600}

/* ---- profesyonel ekler ---- */
.alt-kart{background:var(--porselen);border:1px solid var(--cizgi);border-radius:9px;padding:12px}
.bilgi-kutu{background:#F5F1E8;border:1px solid #E5DAC3;border-radius:9px;padding:10px 12px;font-size:12px;color:#655334;margin-bottom:10px}
.rapor-kutular .ozet-kutu{min-width:calc(50% - 4px)}
.rapor-kutular{flex-wrap:wrap}
.rapor-aciklama{font-size:12px;line-height:1.5;color:var(--soluk);background:#fff;border-left:3px solid var(--pirinc);padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0 18px}
.rapor-org{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--cizgi)}
.rapor-org:last-child{border-bottom:none}
.rapor-org>div{min-width:0}.rapor-org>div:last-child{text-align:right}
.rapor-org b{display:block;font-size:13px}.rapor-org span{display:block;font-size:10.5px;color:var(--soluk);margin-top:2px}
.rapor-iki{display:grid;grid-template-columns:1fr;gap:0}
.fiyat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fiyat-grid>div{background:var(--porselen);border-radius:8px;padding:10px}.fiyat-grid>div>span{font-size:11px;color:var(--soluk);font-weight:700}
.uc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.uc>div{min-width:0}
@media(max-width:390px){.uc{grid-template-columns:1fr}.fiyat-grid{grid-template-columns:1fr}.ciftli{flex-direction:column}}

/* ---- işlem geçmişi ---- */
.gecmis-ust{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 14px}
.gecmis-kart{background:var(--kart);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--golge);border-left:3px solid var(--cizgi)}
.gecmis-kart.ekle{border-left-color:#4C7A5B}.gecmis-kart.silme{border-left-color:var(--kirmizi)}.gecmis-kart.duzenle{border-left-color:var(--pirinc)}
.gecmis-meta{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:var(--soluk);margin-bottom:5px}
.gecmis-bas{font-size:14px;font-weight:700;margin-bottom:3px}.gecmis-hedef{font-size:13px}.gecmis-detay{font-size:11.5px;color:var(--soluk);margin-top:5px;line-height:1.45;white-space:pre-wrap}
.gecmis-kullanici{font-weight:600;color:var(--kadife);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- rapor ---- */
.ozet-kutular{display:flex;gap:8px;margin-bottom:16px}
.ozet-kutu{flex:1;background:var(--kart);border-radius:10px;padding:12px;box-shadow:var(--golge)}
.ozet-kutu b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.ozet-kutu small{font-size:10.5px;color:var(--soluk)}
.gelir-renk{color:var(--kadife)}
.gider-renk{color:var(--kirmizi)}

/* ---- ortak kullanım / giriş ---- */
.giris-kabuk{max-width:430px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 34px) 18px 60px;min-height:100vh;display:flex;align-items:center}
.giris-kart{width:100%;background:var(--kart);border:1px solid var(--cizgi);border-radius:18px;padding:24px;box-shadow:0 12px 36px rgba(28,37,35,.08)}
.giris-logo{font-size:30px;margin:0 0 4px}.giris-alt{margin:0 0 22px;color:var(--soluk);font-size:13px}
.giris-kart .alan{margin-bottom:12px}.giris-kart .dg{margin-top:4px}
.giris-hata{display:none;margin:12px 0 0;padding:10px 12px;border-radius:8px;background:#F6E2E0;color:#7A2621;font-size:12.5px}
.giris-bilgi{padding:11px 12px;border-radius:9px;background:#F4EAD8;color:#6B4A16;font-size:12.5px;margin-bottom:16px}
.senkron{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--soluk)}
.senkron-nokta{width:7px;height:7px;border-radius:50%;background:#B6BCB8}.senkron-nokta.ok{background:#4A7B61}.senkron-nokta.hata{background:var(--kirmizi)}
.oturum-satir{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 18px 8px;max-width:520px;margin:0 auto;color:var(--soluk);font-size:11.5px}
.oturum-cik{border:none;background:none;padding:0;color:var(--kadife);font-weight:700;font-size:11.5px}

/* ---- yazdırma ---- */
#yazdirma{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .kabuk,.sekmeler{display:none !important}
  #yazdirma{display:block;padding:0;font-size:12px}
  #yazdirma h1{font-size:22px;margin:2px 0 2px;letter-spacing:-.02em}
  #yazdirma .pdf-ust{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1C2523;padding-bottom:12px;margin-bottom:14px}
  #yazdirma .pdf-marka{font-size:11px;font-weight:700;letter-spacing:.14em;margin:0}
  #yazdirma .pdf-ust p{margin:0;color:#555}.pdf-tarih{font-size:10px;color:#666;text-align:right}
  #yazdirma .pdf-ozet{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 18px}.pdf-ozet>div{border:1px solid #bbb;padding:9px}.pdf-ozet span{display:block;font-size:9px;color:#666}.pdf-ozet b{display:block;font-size:14px;margin-top:3px}
  #yazdirma h2{font-size:14px;margin:18px 0 6px}
  #yazdirma table{width:100%;border-collapse:collapse}
  #yazdirma th,#yazdirma td{border-bottom:1px solid #ccc;padding:5px 4px;text-align:left}
  #yazdirma td.sag,#yazdirma th.sag{text-align:right}
  #yazdirma tr.kalin td{font-weight:700;border-top:2px solid #333;border-bottom:none}
  #yazdirma .pdf-sonuc{margin-top:18px;border:2px solid #1C2523;padding:10px 12px;display:flex;justify-content:space-between;font-size:15px}.pdf-dip{font-size:9px;color:#777;margin-top:18px;text-align:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div id="girisEkrani" style="display:none"></div>
<div id="ortakUygulama" style="display:none">
<div class="kabuk">
  <header class="tepe">
    <h1 class="marka serif">Much&More <span style="font-family:Karla,system-ui;font-size:11px;font-weight:600;color:var(--soluk);letter-spacing:.04em">ORGANİZASYON</span></h1>
    <span class="tepe-not" id="tepeNot"></span>
  </header>
  <div class="oturum-satir"><span id="oturumKim"></span><button class="oturum-cik" id="oturumCik" type="button">Çıkış</button></div>
  <div id="serit"></div>
  <main id="uygulama"><div class="ekran"><p class="bos">Yükleniyor…</p></div></main>
</div>

<nav class="sekmeler" id="sekmeler"></nav>
</div>
<div id="yazdirma"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
"use strict";

/* ================= sabitler ================= */
const ANAHTAR = "org-defteri:v2"; // Eski kayıtları kaybetmemek için aynı anahtar.
const AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const AY_KISA = ["oca","şub","mar","nis","may","haz","tem","ağu","eyl","eki","kas","ara"];
const GUN_ADLARI = ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const RENKLER = [
  {ad:"Bordo",hex:"#6E1023"},{ad:"Kırmızı",hex:"#A32020"},{ad:"Somon",hex:"#E8927C"},
  {ad:"Pudra",hex:"#E8C4C4"},{ad:"Beyaz",hex:"#F7F5F2"},{ad:"Krem",hex:"#E8DCC6"},
  {ad:"Şampanya",hex:"#E5D3B3"},{ad:"Altın",hex:"#C39B47"},{ad:"Gümüş",hex:"#C0C3C7"},
  {ad:"Füme",hex:"#6B6B72"},{ad:"Siyah",hex:"#16151A"},{ad:"Lacivert",hex:"#1F2C4C"},
  {ad:"Mavi",hex:"#3A6EA5"},{ad:"Turkuaz",hex:"#2E7E8C"},{ad:"Yeşil",hex:"#2F5D46"},
  {ad:"Mor",hex:"#4A2A5A"},{ad:"Lila",hex:"#B7A2CC"},{ad:"Bej",hex:"#D9C9AE"},
  {ad:"Kahve",hex:"#5A4030"},{ad:"Zeytin",hex:"#6C7248"}
];
const TURLER = ["Düğün","Nişan","Kına","Söz","Sünnet","Doğum günü","Kurumsal","Diğer"];
const ORG_GIDER_KALEMLERI = ["Maaş","Market gideri","Ozalit gideri","Faturalar","Ulaşım","Diğer"];
const SABIT_GIDER_KALEMLERI = ["Kira","Aidat","Stopaj"];
const GUNCEL_FIYAT = {
  id:"fiyat-2026-09", gecerli:"2026-09-01",
  ordovr50:2340, et50:2850, tavuk50:2750,
  ordovr100:1950, et100:2350, tavuk100:2250
};

/* ================= durum ================= */
let D = null;
let ekran = "takvim";
let acikAy = new Date().getMonth();
let acikYil = new Date().getFullYear();
let acikGun = null;
let seciliOrg = null;
let taslak = null;
let raporAy = ayAnahtar(bugunISO());
let giderAy = ayAnahtar(bugunISO());
let auditKayitlari = [];
let auditYukleniyor = false;

function varsayilan(){
  return {
    organizasyonlar: [],
    menuFiyatlari: [JSON.parse(JSON.stringify(GUNCEL_FIYAT))],
    sabitGiderler: {},
    digerGiderler: [],
    ayarlar: {garsonBasi:10, garsonUcreti:2000, faturaOrani:20}
  };
}

/* ================= yardımcılar ================= */
function yeniId(){ return "k"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function xmlEsc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c])); }
function sayi(v){ const n=parseFloat(String(v==null?"":v).replace(",", ".")); return isFinite(n)?n:0; }
function para(n){ return new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0}).format(Math.round(sayi(n))); }
function paraDuz(n){ return new Intl.NumberFormat("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2}).format(sayi(n)); }
function iki(n){ return String(n).padStart(2,"0"); }
function bugunISO(){ const d=new Date(); return d.getFullYear()+"-"+iki(d.getMonth()+1)+"-"+iki(d.getDate()); }
function ayAnahtar(iso){ return /^\d{4}-\d{2}/.test(String(iso||"")) ? String(iso).slice(0,7) : ""; }
function ayAdi(anahtar){ if(!/^\d{4}-\d{2}$/.test(String(anahtar||""))) return "—"; const [y,m]=anahtar.split("-"); return AYLAR[Number(m)-1]+" "+y; }
function tarihYaz(iso){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||""))) return "—"; const [y,m,g]=iso.split("-"); return Number(g)+" "+AYLAR[Number(m)-1]+" "+y; }
function tarihKisa(iso){ if(!/^\d{4}-\d{2}-\d{2}$/.test(String(iso||""))) return "—"; const [,m,g]=iso.split("-"); return Number(g)+" "+AY_KISA[Number(m)-1]; }
function renkHex(ad){ const r=RENKLER.find(x=>x.ad===ad); return r?r.hex:"#D8DAD4"; }
function el(id){ return document.getElementById(id); }

function jsonEsit(a,b){ try{return JSON.stringify(a)===JSON.stringify(b);}catch(e){return false;} }
function nesneMi(v){ return v && typeof v==="object" && !Array.isArray(v); }
function idDizisiMi(a){ return Array.isArray(a) && a.every(x=>nesneMi(x) && x.id!=null); }

function ucYolluBirlestir(base, local, remote){
  if(jsonEsit(local,base)) return klon(remote);
  if(jsonEsit(remote,base)) return klon(local);
  if(nesneMi(local) && nesneMi(remote)){
    const b=nesneMi(base)?base:{}, out={};
    const keys=new Set([...Object.keys(b),...Object.keys(local),...Object.keys(remote)]);
    for(const k of keys){
      const bHas=Object.prototype.hasOwnProperty.call(b,k), lHas=Object.prototype.hasOwnProperty.call(local,k), rHas=Object.prototype.hasOwnProperty.call(remote,k);
      if(bHas && !lHas) continue;
      if(!bHas && lHas){ out[k]=klon(local[k]); continue; }
      if(!lHas && rHas){ out[k]=klon(remote[k]); continue; }
      if(lHas && !rHas){ out[k]=klon(local[k]); continue; }
      out[k]=ucYolluBirlestir(b[k],local[k],remote[k]);
    }
    return out;
  }
  if(Array.isArray(local) && Array.isArray(remote)){
    const b=Array.isArray(base)?base:[];
    if(idDizisiMi(local) && idDizisiMi(remote) && (b.length===0 || idDizisiMi(b))){
      const bm=new Map(b.map(x=>[String(x.id),x])), lm=new Map(local.map(x=>[String(x.id),x])), rm=new Map(remote.map(x=>[String(x.id),x]));
      const order=[]; for(const x of remote) order.push(String(x.id)); for(const x of local) if(!order.includes(String(x.id))) order.push(String(x.id));
      const out=[];
      for(const id of order){
        const bv=bm.get(id), lv=lm.get(id), rv=rm.get(id);
        if(bv && !lv) continue;
        if(!bv && lv){ out.push(klon(lv)); continue; }
        if(lv && !rv){ out.push(klon(lv)); continue; }
        if(!lv && rv){ out.push(klon(rv)); continue; }
        if(lv && rv) out.push(ucYolluBirlestir(bv,lv,rv));
      }
      return out;
    }
    return klon(local);
  }
  return klon(local);
}

function auditDetayYaz(detail){
  if(!detail) return "";
  if(typeof detail==="string") return detail;
  if(Array.isArray(detail.degisiklikler) && detail.degisiklikler.length) return detail.degisiklikler.join(" · ");
  const a=[];
  if(detail.tarih) a.push("Tarih: "+tarihYaz(detail.tarih));
  if(detail.kisi) a.push(detail.kisi+" kişi");
  if(detail.kalem) a.push(detail.kalem);
  if(detail.tutar!=null) a.push(para(detail.tutar));
  if(detail.eski!=null || detail.yeni!=null) a.push(String(detail.eski??"—")+" → "+String(detail.yeni??"—"));
  if(detail.aciklama) a.push(detail.aciklama);
  return a.join(" · ");
}

function alanDegisiklikleri(eski,yeni){
  const alanlar=[
    ["musteri","Müşteri"],["telefon","Telefon"],["tur","Tür"],["tarih","Tarih"],["saat","Saat"],["kisiSayisi","Kişi sayısı"],["sonGorusme","Detay görüşmesi"],["kisiBasiOzel","Anlaşılan kişi başı"],["faturali","Faturalı"],["notlar","Notlar"],
    ["menuler.ordovr","Ordövr"],["menuler.et","Et menü"],["menuler.tavuk","Tavuk menü"],["dekorasyon.tavan.renk","Tavan rengi"],["dekorasyon.tavan.ucret","Tavan ücreti"],["dekorasyon.perde.renk","Perde rengi"],["dekorasyon.perde.ucret","Perde ücreti"],["dekorasyon.zemin.ucret","Zemin ücreti"],["dekorasyon.masa.not","Masa üzeri dekorasyon"],["tasarim.menuKarti.secili","Menü kartı"],["tasarim.menuKarti.ucret","Menü kartı ücreti"],["tasarim.ayna.secili","Ayna"],["tasarim.ayna.ucret","Ayna ücreti"],["personel.garsonEkUcret","Garson yol/ek ücret"],["personel.garsonEkNot","Garson ek not"],["personel.dj","DJ gideri"],["personel.mutfak","Mutfak personeli gideri"]
  ];
  const get=(o,path)=>path.split(".").reduce((v,k)=>v==null?undefined:v[k],o);
  const fmt=(v)=>typeof v==="boolean"?(v?"Evet":"Hayır"):(v==null||v===""?"—":String(v));
  const d=[];
  for(const [path,ad] of alanlar){const a=get(eski,path),b=get(yeni,path);if(!jsonEsit(a,b)) d.push(ad+": "+fmt(a)+" → "+fmt(b));}
  return d;
}
function diziAudit(eski,yeni,tip,etiket,org){
  const em=new Map((eski||[]).map(x=>[String(x.id),x])), nm=new Map((yeni||[]).map(x=>[String(x.id),x])), out=[];
  const label=org.musteri||"İsimsiz organizasyon";
  for(const [id,x] of nm){
    const e=em.get(id);
    if(!e) out.push(auditKaydi(tip+"_eklendi",tip,org.id,label,{kalem:x.etiket||x.kalem||etiket,tutar:sayi(x.tutar),tarih:x.tarih||org.tarih}));
    else if(!jsonEsit(e,x)) out.push(auditKaydi(tip+"_degisti",tip,org.id,label,{aciklama:(e.etiket||e.kalem||etiket)+" → "+(x.etiket||x.kalem||etiket),eski:para(e.tutar),yeni:para(x.tutar),tarih:x.tarih||org.tarih}));
  }
  for(const [id,x] of em) if(!nm.has(id)) out.push(auditKaydi(tip+"_silindi",tip,org.id,label,{kalem:x.etiket||x.kalem||etiket,tutar:sayi(x.tutar),tarih:x.tarih||org.tarih}));
  return out;
}
function orgAuditKayitlari(eski,yeni){
  const label=yeni.musteri||"İsimsiz organizasyon", out=[];
  if(!eski){
    out.push(auditKaydi("organizasyon_eklendi","organizasyon",yeni.id,label,{tarih:yeni.tarih,kisi:sayi(yeni.kisiSayisi),tutar:hesapla(yeni).toplam}));
    out.push(...diziAudit([],yeni.odemeler,"odeme","Ödeme",yeni),...diziAudit([],yeni.giderler,"org_gider","Gider",yeni));
    return out;
  }
  const d=alanDegisiklikleri(eski,yeni);
  const eskiEkstra=eski.dekorasyon&&eski.dekorasyon.ekstra||[], yeniEkstra=yeni.dekorasyon&&yeni.dekorasyon.ekstra||[];
  if(!jsonEsit(eskiEkstra,yeniEkstra)) d.push("Ekstra dekorasyon kalemleri değiştirildi");
  if(d.length) out.push(auditKaydi("organizasyon_guncellendi","organizasyon",yeni.id,label,{degisiklikler:d}));
  out.push(...diziAudit(eski.odemeler,yeni.odemeler,"odeme","Ödeme",yeni),...diziAudit(eski.giderler,yeni.giderler,"org_gider","Gider",yeni));
  return out;
}

function fiyatNormalize(f){
  f=f||{};
  const eskiO=sayi(f.ordovr), eskiE=sayi(f.et), eskiT=sayi(f.tavuk);
  return {
    id:f.id||yeniId(), gecerli:f.gecerli||bugunISO(),
    ordovr50: f.ordovr50!=null?sayi(f.ordovr50):eskiO,
    et50: f.et50!=null?sayi(f.et50):eskiE,
    tavuk50: f.tavuk50!=null?sayi(f.tavuk50):eskiT,
    ordovr100: f.ordovr100!=null?sayi(f.ordovr100):eskiO,
    et100: f.et100!=null?sayi(f.et100):eskiE,
    tavuk100: f.tavuk100!=null?sayi(f.tavuk100):eskiT
  };
}
function veriDuzenle(v){
  const b=varsayilan();
  const x=v&&typeof v==="object"?v:{};
  const out={
    organizasyonlar:Array.isArray(x.organizasyonlar)?x.organizasyonlar:[],
    menuFiyatlari:Array.isArray(x.menuFiyatlari)&&x.menuFiyatlari.length?x.menuFiyatlari.map(fiyatNormalize):b.menuFiyatlari,
    sabitGiderler:x.sabitGiderler&&typeof x.sabitGiderler==="object"?x.sabitGiderler:{},
    digerGiderler:Array.isArray(x.digerGiderler)?x.digerGiderler:[],
    ayarlar:Object.assign({},b.ayarlar,x.ayarlar||{})
  };
  out.ayarlar.garsonBasi=sayi(out.ayarlar.garsonBasi)||10;
  out.ayarlar.garsonUcreti=sayi(out.ayarlar.garsonUcreti)||2000;
  out.ayarlar.faturaOrani=sayi(out.ayarlar.faturaOrani);

  // İlk sürümdeki boş varsayılan listeyi gerçek güncel listeyle değiştir.
  if(out.menuFiyatlari.length===1){
    const f=out.menuFiyatlari[0];
    const toplam=f.ordovr50+f.et50+f.tavuk50+f.ordovr100+f.et100+f.tavuk100;
    if(toplam===0) out.menuFiyatlari=[klon(GUNCEL_FIYAT)];
  }

  out.organizasyonlar=out.organizasyonlar.map(o=>orgNormalize(o,out));
  return out;
}
function orgNormalize(o,veri){
  o=o&&typeof o==="object"?o:{};
  const dk=o.dekorasyon||{};
  const ts=o.tasarim||{};
  const masa=dk.masa||{};
  const eskiMasaNot=masa.not||"";
  const p=o.personel||{};
  const no={
    id:o.id||yeniId(), musteri:o.musteri||"", telefon:o.telefon||"", tur:o.tur||"Düğün",
    tarih:o.tarih||bugunISO(), saat:o.saat||"", kisiSayisi:o.kisiSayisi==null?"":o.kisiSayisi,
    sonGorusme:o.sonGorusme||bugunISO(),
    menuler:Object.assign({ordovr:true,et:true,tavuk:false},o.menuler||{}),
    kisiBasiOzel:o.kisiBasiOzel==null?"":o.kisiBasiOzel,
    fiyatSnapshot:o.fiyatSnapshot?fiyatNormalize(o.fiyatSnapshot):null,
    dekorasyon:{
      tavan:Object.assign({aciklama:"",renk:"Krem",ucret:""},dk.tavan||{}),
      perde:Object.assign({aciklama:"",renk:"Bordo",ucret:""},dk.perde||{}),
      zemin:{ucret:dk.zemin&&dk.zemin.ucret!=null?dk.zemin.ucret:""},
      masa:{not:eskiMasaNot},
      ekstra:Array.isArray(dk.ekstra)?dk.ekstra:[]
    },
    tasarim:{
      menuKarti:Object.assign({secili:false,aciklama:"",ucret:""},ts.menuKarti||{}),
      ayna:Object.assign({secili:false,aciklama:"",ucret:""},ts.ayna||{})
    },
    personel:{
      garsonEkUcret:p.garsonEkUcret==null?"":p.garsonEkUcret,
      garsonEkNot:p.garsonEkNot||"",
      dj:p.dj==null?"":p.dj,
      mutfak:p.mutfak==null?"":p.mutfak
    },
    faturali:!!o.faturali,
    odemeler:Array.isArray(o.odemeler)?o.odemeler:[],
    giderler:Array.isArray(o.giderler)?o.giderler:[],
    notlar:o.notlar||""
  };
  if(!no.fiyatSnapshot){
    const liste=menuListeBulVeri(veri,no.tarih);
    if(liste) no.fiyatSnapshot=klon(liste);
  }
  return no;
}

/* ================= fiyat / hesap ================= */
function menuListeBulVeri(veri,tarih){
  const liste=(veri.menuFiyatlari||[]).slice().sort((a,b)=>String(a.gecerli).localeCompare(String(b.gecerli)));
  if(!liste.length) return fiyatNormalize(GUNCEL_FIYAT);
  let secili=liste[0];
  for(const f of liste){ if(!tarih || f.gecerli<=tarih) secili=f; }
  return fiyatNormalize(secili);
}
function menuListeBul(tarih){ return menuListeBulVeri(D,tarih); }
function guncelMenuListesi(){ return menuListeBul(bugunISO()); }
function fiyatKademe(f,kisiSayisi){
  f=fiyatNormalize(f);
  const kisi=sayi(kisiSayisi);
  const buyuk=kisi>=100;
  let uyari="";
  if(kisi>=81 && kisi<=99) uyari="81–99 kişi için otomatik başlangıç fiyatı 50–80 kademesinden alındı. Pazarlığa göre anlaşılan kişi başı bedeli kontrol edin.";
  else if(kisi>0 && kisi<50) uyari="50 kişinin altı için otomatik başlangıç fiyatı 50–80 kademesinden alındı. Özel fiyat gerekiyorsa anlaşılan bedeli değiştirin.";
  return {
    etiket:buyuk?"100+ kişi":"50–80 kişi",
    uyari,
    ordovr:buyuk?f.ordovr100:f.ordovr50,
    et:buyuk?f.et100:f.et50,
    tavuk:buyuk?f.tavuk100:f.tavuk50
  };
}
function orgFiyat(o){
  const liste=o.fiyatSnapshot?fiyatNormalize(o.fiyatSnapshot):menuListeBul(o.tarih);
  return {liste,kademe:fiyatKademe(liste,o.kisiSayisi)};
}
function listeKisiBasi(o){
  const f=orgFiyat(o).kademe, m=o.menuler||{};
  let t=0;
  if(m.ordovr) t+=sayi(f.ordovr);
  if(m.et) t+=sayi(f.et);
  if(m.tavuk) t+=sayi(f.tavuk);
  return t;
}
function hesapla(o){
  const listeToplam=listeKisiBasi(o);
  const kisiBasi=(o.kisiBasiOzel!=="" && o.kisiBasiOzel!=null)?sayi(o.kisiBasiOzel):listeToplam;
  const kisi=sayi(o.kisiSayisi);
  const yemek=kisiBasi*kisi;
  const dk=o.dekorasyon||{};
  const ekstra=Array.isArray(dk.ekstra)?dk.ekstra:[];
  const ekstraDekor=ekstra.reduce((t,x)=>t+sayi(x.ucret),0);
  const dekorasyon=sayi(dk.tavan&&dk.tavan.ucret)+sayi(dk.perde&&dk.perde.ucret)+sayi(dk.zemin&&dk.zemin.ucret)+ekstraDekor;
  const ts=o.tasarim||{};
  const tasarim=(ts.menuKarti&&ts.menuKarti.secili?sayi(ts.menuKarti.ucret):0)+(ts.ayna&&ts.ayna.secili?sayi(ts.ayna.ucret):0);
  const ara=yemek+dekorasyon+tasarim;
  const oran=sayi(D.ayarlar.faturaOrani)/100;
  const fatura=o.faturali?ara*oran:0;
  const toplam=ara+fatura;
  const alinan=(o.odemeler||[]).reduce((t,x)=>t+sayi(x.tutar),0);
  const garsonBasi=sayi(D.ayarlar.garsonBasi)||10;
  const garson=kisi>0?Math.ceil(kisi/garsonBasi):0;
  const garsonBirim=sayi(D.ayarlar.garsonUcreti)||2000;
  const p=o.personel||{};
  const garsonTemel=garson*garsonBirim;
  const garsonEk=sayi(p.garsonEkUcret);
  const dj=sayi(p.dj), mutfak=sayi(p.mutfak);
  const personelToplam=garsonTemel+garsonEk+dj+mutfak;
  const manuelGider=(o.giderler||[]).reduce((t,x)=>t+sayi(x.tutar),0);
  const gider=personelToplam+manuelGider;
  return {listeToplam,kisiBasi,kisi,yemek,ekstraDekor,dekorasyon,tasarim,ara,fatura,toplam,alinan,kalan:toplam-alinan,garson,garsonBirim,garsonTemel,garsonEk,dj,mutfak,personelToplam,manuelGider,gider};
}
function ozetleKalemler(liste){
  const m={};
  liste.forEach(x=>{ const k=x.kalem||"Diğer"; m[k]=(m[k]||0)+sayi(x.tutar); });
  return Object.entries(m).map(([kalem,tutar])=>({kalem,tutar})).sort((a,b)=>b.tutar-a.tutar);
}
function aylikRapor(anahtar){
  anahtar=/^\d{4}-\d{2}$/.test(String(anahtar||""))?anahtar:ayAnahtar(bugunISO());
  const gelirler=[],giderler=[],organizasyonlar=[];
  for(const o of D.organizasyonlar){
    const h=hesapla(o);
    if(ayAnahtar(o.tarih)===anahtar){
      organizasyonlar.push({tarih:o.tarih,ad:o.musteri||"İsimsiz",tur:o.tur||"",kisi:sayi(o.kisiSayisi),toplam:h.toplam,alinan:h.alinan,kalan:h.kalan});
      if(h.garsonTemel>0) giderler.push({tarih:o.tarih,ad:o.musteri||"İsimsiz",kalem:"Garson gideri ("+h.garson+" × "+para(h.garsonBirim)+")",tutar:h.garsonTemel,tur:"personel"});
      if(h.garsonEk>0) giderler.push({tarih:o.tarih,ad:o.musteri||"İsimsiz",kalem:"Garson yol / ek ücret"+(o.personel&&o.personel.garsonEkNot?" · "+o.personel.garsonEkNot:""),tutar:h.garsonEk,tur:"personel"});
      if(h.dj>0) giderler.push({tarih:o.tarih,ad:o.musteri||"İsimsiz",kalem:"DJ gideri",tutar:h.dj,tur:"personel"});
      if(h.mutfak>0) giderler.push({tarih:o.tarih,ad:o.musteri||"İsimsiz",kalem:"Mutfak personeli gideri",tutar:h.mutfak,tur:"personel"});
    }
    for(const p of (o.odemeler||[])){
      if(ayAnahtar(p.tarih)===anahtar) gelirler.push({tarih:p.tarih,ad:o.musteri||"İsimsiz",kalem:p.etiket||"Ödeme",tutar:sayi(p.tutar),orgId:o.id});
    }
    for(const g of (o.giderler||[])){
      const t=g.tarih||o.tarih;
      if(ayAnahtar(t)===anahtar) giderler.push({tarih:t,ad:o.musteri||"İsimsiz",kalem:g.kalem||"Gider",tutar:sayi(g.tutar),tur:"organizasyon"});
    }
  }
  for(const s of (D.sabitGiderler[anahtar]||[])) giderler.push({tarih:anahtar+"-01",ad:"Aylık sabit",kalem:s.kalem||"Sabit gider",tutar:sayi(s.tutar),tur:"sabit"});
  for(const g of (D.digerGiderler||[])) if(ayAnahtar(g.tarih)===anahtar) giderler.push({tarih:g.tarih,ad:g.aciklama||"Genel",kalem:g.kalem||"Genel gider",tutar:sayi(g.tutar),tur:"diger"});
  gelirler.sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||""));
  giderler.sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||""));
  organizasyonlar.sort((a,b)=>(a.tarih||"").localeCompare(b.tarih||""));
  const toplamGelir=gelirler.reduce((t,x)=>t+x.tutar,0);
  const toplamGider=giderler.reduce((t,x)=>t+x.tutar,0);
  const satisToplam=organizasyonlar.reduce((t,x)=>t+x.toplam,0);
  const orgAlinan=organizasyonlar.reduce((t,x)=>t+x.alinan,0);
  const orgKalan=organizasyonlar.reduce((t,x)=>t+x.kalan,0);
  return {gelirler,giderler,organizasyonlar,toplamGelir,toplamGider,net:toplamGelir-toplamGider,satisToplam,orgAlinan,orgKalan,gelirOzet:ozetleKalemler(gelirler),giderOzet:ozetleKalemler(giderler)};
}
function ayKaydir(anahtar,adim){
  let y,m;
  const es=String(anahtar||"").match(/^(\d{4})-(\d{2})$/);
  if(es){ y=Number(es[1]); m=Number(es[2]); } else { const d=new Date(); y=d.getFullYear(); m=d.getMonth()+1; }
  const d=new Date(y,m-1+Number(adim||0),1);
  return d.getFullYear()+"-"+iki(d.getMonth()+1);
}

  let hucreler="";
  for(let i=kayma-1;i>=0;i--) hucreler+='<div class="gun disari">'+(oncekiSon-i)+'</div>';
  for(let g=1;g<=gunSayisi;g++){
    const iso=acikYil+"-"+iki(acikAy+1)+"-"+iki(g), orgs=D.organizasyonlar.filter(o=>o.tarih===iso);
    let kutular="";

  const tasarim='<label class="onay"><input type="checkbox" data-tasarim="menuKarti" '+(ts.menuKarti.secili?"checked":"")+'> Menü kartı tasarımı</label><input class="gir" data-tasarim-alan="menuKarti.aciklama" value="'+esc(ts.menuKarti.aciklama)+'" placeholder="Model / not" style="margin-bottom:8px"><input class="gir" type="number" inputmode="decimal" data-tasarim-alan="menuKarti.ucret" data-hesap="1" value="'+esc(ts.menuKarti.ucret)+'" placeholder="Ücret"><label class="onay" style="margin-top:14px"><input type="checkbox" data-tasarim="ayna" '+(ts.ayna.secili?"checked":"")+'> Ayna tasarımı</label><input class="gir" data-tasarim-alan="ayna.aciklama" value="'+esc(ts.ayna.aciklama)+'" placeholder="Model / not" style="margin-bottom:8px"><input class="gir" type="number" inputmode="decimal" data-tasarim-alan="ayna.ucret" data-hesap="1" value="'+esc(ts.ayna.ucret)+'" placeholder="Ücret">';

function formOzetGuncelle(){
  if(!taslak) return; const h=hesapla(taslak), f=orgFiyat(taslak);
  const set=(id,v)=>{const e=el(id); if(e) e.textContent=v;};
  set("yapisToplam",para(h.toplam)); set("garsonYazi",h.garson?h.garson+" garson":"Kişi sayısı girin"); set("ozetGenel",taslak.kisiSayisi?taslak.kisiSayisi+" kişi":""); set("ozetMenu",para(h.yemek)+(taslak.faturali?" +fatura":"")); set("ozetDekor",para(h.dekorasyon)); set("ozetTasarim",para(h.tasarim)); set("ozetOdeme",para(h.alinan)); set("ozetGider",para(h.gider));
  set("fiyatKademe",f.kademe.etiket); set("menuFiyat_ordovr",para(f.kademe.ordovr)); set("menuFiyat_et",para(f.kademe.et)); set("menuFiyat_tavuk",para(f.kademe.tavuk));
  const u=el("fiyatUyari"); if(u){u.textContent=f.kademe.uyari;u.style.display=f.kademe.uyari?"block":"none";}
  const kb=el("kisiBasiOzelGiris"); if(kb && taslak.kisiBasiOzel==="") kb.value=h.listeToplam;
  set("garsonGiderDetay","("+h.garson+" × "+para(h.garsonBirim)+")"); set("garsonGiderToplam",para(h.garsonTemel)); set("personelToplam",para(h.personelToplam));
  odemeListeCiz(); giderListeCiz(); ekstraDekorListeCiz();
}
function odemeListeCiz(){ const k=el("odemeListe"); if(!k) return; k.innerHTML=(taslak.odemeler||[]).length?'<div class="mini-liste">'+taslak.odemeler.map(p=>'<div class="mini"><div class="mini-orta"><div>'+esc(p.etiket)+'</div><div class="mini-alt">'+tarihYaz(p.tarih)+'</div></div><span class="tutar" style="font-weight:600">'+para(p.tutar)+'</span><button type="button" class="sil" data-odeme-sil="'+p.id+'">×</button></div>').join("")+'</div>':'<p class="bos" style="margin:0">Henüz ödeme yok.</p>'; }
function giderListeCiz(){ const k=el("giderListe"); if(!k) return; k.innerHTML=(taslak.giderler||[]).length?'<div class="mini-liste">'+taslak.giderler.map(g=>'<div class="mini"><div class="mini-orta"><div>'+esc(g.kalem)+'</div><div class="mini-alt">'+tarihYaz(g.tarih||taslak.tarih)+'</div></div><span class="tutar" style="font-weight:600">'+para(g.tutar)+'</span><button type="button" class="sil" data-gider-sil="'+g.id+'">×</button></div>').join("")+'</div>':'<p class="bos" style="margin:0">Başka gider yok.</p>'; }
function ekstraDekorListeCiz(){ const k=el("ekstraDekorListe"); if(!k) return; const l=taslak.dekorasyon.ekstra||[]; k.innerHTML=l.length?'<div class="mini-liste">'+l.map(x=>'<div class="mini"><div class="mini-orta"><div>'+esc(x.aciklama||"Ekstra dekorasyon")+'</div></div><span class="tutar" style="font-weight:600">'+para(x.ucret)+'</span><button type="button" class="sil" data-ekstra-dekor-sil="'+x.id+'">×</button></div>').join("")+'</div>':'<p class="bos" style="margin:0">Ekstra dekorasyon yok.</p>'; }
function formHata(m){ const k=el("formHata"); if(k){k.textContent=m;k.style.display="block";window.scrollTo(0,0);} }

/* ================= gider ekranı ================= */
function giderEkrani(){
  const sabit=D.sabitGiderler[giderAy]||[], sabitToplam=sabit.reduce((t,x)=>t+sayi(x.tutar),0), r=aylikRapor(giderAy), orgGider=r.giderler.filter(x=>x.tur==="organizasyon"||x.tur==="personel"), digerler=(D.digerGiderler||[]).filter(g=>ayAnahtar(g.tarih)===giderAy);

    +'<h3 class="bolum-baslik">Aylık sabit giderler</h3><div class="kart">'+(sabit.length?'<div class="mini-liste">'+sabit.map(s=>'<div class="mini"><div class="mini-orta">'+esc(s.kalem)+'</div><span class="tutar" style="font-weight:600">'+para(s.tutar)+'</span><button class="sil" data-sabit-sil="'+s.id+'">×</button></div>').join("")+'</div>':'<p class="bos" style="margin:0">Bu ay için sabit gider girilmemiş.</p>')+'<div class="ekle-satir"><input class="gir" id="sabitKalem" list="sabitListe" placeholder="Kalem"><datalist id="sabitListe">'+SABIT_GIDER_KALEMLERI.map(k=>'<option value="'+esc(k)+'">').join("")+'</datalist><input class="gir" type="number" inputmode="decimal" id="sabitTutar" placeholder="Tutar"><button class="dg ana" id="sabitEkle">Ekle</button></div>'+(sabitToplam?'<div class="hesap-satir sonuc"><span>Sabit toplam</span><span class="tutar serif-tutar">'+para(sabitToplam)+'</span></div>':'')+'<button class="dg ufak genis" id="oncekiAydanKopyala" style="margin-top:10px">Önceki aydan kopyala</button></div>'
    +'<h3 class="bolum-baslik">Genel giderler</h3><div class="kart">'+(digerler.length?'<div class="mini-liste">'+digerler.map(g=>'<div class="mini"><div class="mini-orta"><div>'+esc(g.kalem)+'</div><div class="mini-alt">'+tarihYaz(g.tarih)+(g.aciklama?" · "+esc(g.aciklama):"")+'</div></div><span class="tutar" style="font-weight:600">'+para(g.tutar)+'</span><button class="sil" data-diger-sil="'+g.id+'">×</button></div>').join("")+'</div>':'<p class="bos" style="margin:0">Kayıt yok.</p>')+'<div class="ekle-satir"><input class="gir" id="digerKalem" list="digerListe" placeholder="Kalem"><datalist id="digerListe">'+ORG_GIDER_KALEMLERI.map(k=>'<option value="'+esc(k)+'">').join("")+'</datalist><input class="gir" id="digerAciklama" placeholder="Açıklama"><input class="gir" type="number" inputmode="decimal" id="digerTutar" placeholder="Tutar"><input class="gir" type="date" id="digerTarih" value="'+giderAy+'-01"><button class="dg ana" id="digerEkle">Ekle</button></div></div>'
    +'<h3 class="bolum-baslik">Organizasyon giderleri (bu ay)</h3><div class="kart">'+(orgGider.length?orgGider.map(g=>'<div class="hesap-satir kucuk"><span>'+esc(g.ad)+' · '+esc(g.kalem)+' · '+tarihKisa(g.tarih)+'</span><span class="tutar">'+para(g.tutar)+'</span></div>').join(""):'<p class="bos" style="margin:0">Kayıt yok. Personel giderleri organizasyon tarihine göre burada görünür.</p>')+'</div>'

/* ================= rapor ================= */

/* ================= fiyatlar ================= */

    +liste.map(f=>'<div class="kart"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>'+tarihYaz(f.gecerli)+' itibarıyla</b><button class="sil" data-fiyat-sil="'+f.id+'">×</button></div><div class="fiyat-grid"><div><span>50–80 kişi</span><div class="hesap-satir"><span>Ordövr</span><b>'+para(f.ordovr50)+'</b></div><div class="hesap-satir"><span>Et</span><b>'+para(f.et50)+'</b></div><div class="hesap-satir"><span>Tavuk</span><b>'+para(f.tavuk50)+'</b></div></div><div><span>100+ kişi</span><div class="hesap-satir"><span>Ordövr</span><b>'+para(f.ordovr100)+'</b></div><div class="hesap-satir"><span>Et</span><b>'+para(f.et100)+'</b></div><div class="hesap-satir"><span>Tavuk</span><b>'+para(f.tavuk100)+'</b></div></div></div></div>').join("")

    +'<h3 class="bolum-baslik">Ayarlar</h3><div class="kart"><div class="alan ciftli"><div><label class="et">Kaç kişiye 1 garson</label><input class="gir" type="number" inputmode="numeric" id="aGarson" value="'+esc(D.ayarlar.garsonBasi)+'"></div><div><label class="et">Garson başı ücret</label><input class="gir" type="number" inputmode="decimal" id="aGarsonUcret" value="'+esc(D.ayarlar.garsonUcreti)+'"></div></div><div class="alan"><label class="et">Fatura oranı (%)</label><input class="gir" type="number" inputmode="decimal" id="aFatura" value="'+esc(D.ayarlar.faturaOrani)+'"></div><button class="dg genis" id="ayarKaydet">Ayarları kaydet</button></div>'

/* ================= işlem geçmişi ================= */

  const liste=auditKayitlari||[];
  return '<div class="ekran"><div class="gecmis-ust"><div><h2 class="serif" style="font-size:23px;margin:0 0 3px">İşlem Geçmişi</h2><p class="ipucu" style="margin:0">Kim, neyi, ne zaman değiştirdi. Bu kayıtlar uygulamadan silinemez.</p></div><button class="dg ufak" id="gecmisYenile">Yenile</button></div>'
    +(auditYukleniyor?'<div class="kart"><p class="bos" style="margin:0">Geçmiş yükleniyor…</p></div>':'')
    +(!auditYukleniyor&&!liste.length?'<div class="kart"><p class="bos" style="margin:0">Henüz işlem geçmişi yok. Bu özellik kurulduktan sonra yapılan işlemler burada görünecek.</p></div>':'')

/* ================= çizim ================= */
function ciz(){
  let icerik="";
  if(ekran==="takvim") icerik=takvimEkrani(); else if(ekran==="detay") icerik=detayEkrani(); else if(ekran==="form") icerik=formEkrani(); else if(ekran==="gider") icerik=giderEkrani(); else if(ekran==="rapor") icerik=raporEkrani(); else if(ekran==="fiyat") icerik=fiyatEkrani(); else if(ekran==="gecmis") icerik=gecmisEkrani();
  el("uygulama").innerHTML=icerik; senkronDurum(D.organizasyonlar.length+" kayıt · senkron","ok"); sekmeleriCiz(); if(ekran==="form") formOzetGuncelle(); window.scrollTo(0,0);
}

document.addEventListener("submit",async(e)=>{
  if(e.target && e.target.id==="girisForm"){
    e.preventDefault();
    const email=el("girisEmail").value.trim(), password=el("girisSifre").value;
    const b=e.target.querySelector("button"); b.disabled=true; b.textContent="Giriş yapılıyor…";
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){ b.disabled=false; b.textContent="Giriş yap"; const h=el("girisHata"); h.textContent=error.message; h.style.display="block"; return; }
    aktifKullanici=data.user; await uygulamayiYukle();

document.addEventListener("input",(e)=>{
  if(ekran!=="form"||!taslak)return; const t=e.target;
  if(t.dataset.alan) taslak[t.dataset.alan]=t.value;
  else if(t.dataset.dekor){const [a,b]=t.dataset.dekor.split(".");taslak.dekorasyon[a][b]=t.value;}
  else if(t.dataset.tasarimAlan){const [a,b]=t.dataset.tasarimAlan.split(".");taslak.tasarim[a][b]=t.value;}
  else if(t.dataset.personel) taslak.personel[t.dataset.personel]=t.value;
  if(t.dataset.hesap||t.dataset.alan==="kisiSayisi") formOzetGuncelle();
});
document.addEventListener("change",(e)=>{
  if(ekran!=="form"||!taslak)return; const t=e.target;
  if(t.dataset.menu){taslak.menuler[t.dataset.menu]=t.checked;formOzetGuncelle();}
  else if(t.dataset.fatura){taslak.faturali=t.checked;formOzetGuncelle();}
  else if(t.dataset.tasarim){taslak.tasarim[t.dataset.tasarim].secili=t.checked;formOzetGuncelle();}
});

/* ================= dışa aktarma ================= */
function dosyaIndir(icerik,ad,tip){
  try{const blob=new Blob([icerik],{type:tip}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=ad;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),3000);return true;}catch(err){serit("Dosya indirilemedi.","hata");return false;}
}
function pdfYazdir(){

  const r=aylikRapor(raporAy);
  const cell=(v,type)=>'<Cell><Data ss:Type="'+(type||"String")+'">'+xmlEsc(v)+'</Data></Cell>', row=(a)=>'<Row>'+a.join("")+'</Row>';
  const bas='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#E8ECEA" ss:Pattern="Solid"/></Style><Style ss:ID="money"><NumberFormat ss:Format="#,##0.00 [$₺-41F]"/></Style></Styles>';
  const ws=(ad,rows)=>'<Worksheet ss:Name="'+xmlEsc(ad)+'"><Table>'+rows.join("")+'</Table></Worksheet>';
  const ozet=[row([cell("Much&More Aylık Rapor"),cell(ayAdi(raporAy))]),row([]),row([cell("Nakit tahsilat"),cell(r.toplamGelir,"Number")]),row([cell("Toplam gider"),cell(r.toplamGider,"Number")]),row([cell("Nakit net"),cell(r.net,"Number")]),row([cell("Organizasyon tutarı"),cell(r.satisToplam,"Number")]),row([cell("Organizasyonlardan kalan"),cell(r.orgKalan,"Number")])];
  const gelir=[row([cell("Tarih"),cell("Müşteri"),cell("Kalem"),cell("Tutar (TL)")])]; r.gelirler.forEach(g=>gelir.push(row([cell(g.tarih),cell(g.ad),cell(g.kalem),cell(g.tutar,"Number")])));
  const gider=[row([cell("Tarih"),cell("Kayıt"),cell("Kalem"),cell("Tutar (TL)")])]; r.giderler.forEach(g=>gider.push(row([cell(g.tarih),cell(g.ad),cell(g.kalem),cell(g.tutar,"Number")])));
  const orgs=[row([cell("Tarih"),cell("Müşteri"),cell("Tür"),cell("Kişi"),cell("Toplam"),cell("Alınan"),cell("Kalan")])]; r.organizasyonlar.forEach(o=>orgs.push(row([cell(o.tarih),cell(o.ad),cell(o.tur),cell(o.kisi,"Number"),cell(o.toplam,"Number"),cell(o.alinan,"Number"),cell(o.kalan,"Number")])));
  const xml=bas+ws("Özet",ozet)+ws("Tahsilatlar",gelir)+ws("Giderler",gider)+ws("Organizasyonlar",orgs)+'</Workbook>';
  dosyaIndir(xml,"much-more-rapor-"+raporAy+".xls","application/vnd.ms-excel;charset=utf-8");
}
